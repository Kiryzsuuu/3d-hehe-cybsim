# MongoDB is not run here — this project connects to MongoDB Atlas via
# DATABASE_URL in .env. Only Redis (session/cache) runs locally via Docker.
#
# To develop against a local MongoDB instead of Atlas, add a `mongo` service
# back with a single-node replica set (Prisma's Mongo connector requires one)
# and point DATABASE_URL at it.
services:
  redis:
    image: redis:7-alpine
    container_name: cybersim-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  redis_data:
